services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Uses your existing .env (DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL, ...).
    env_file: .env

  # Optional: sync configs/schema.ts to the database after schema changes.
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    profiles: ["tools"]
