services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    # Share the Pi's network so the app reaches Postgres (192.168.1.237) exactly
    # like a non-Docker process would. `ports:` is not used in host mode.
    network_mode: host
    # Uses your existing .env (DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL, ...).
    env_file: .env
    # Caddy proxies to port 3003; these override any PORT/HOSTNAME in .env.
    environment:
      PORT: "3003"
      HOSTNAME: "0.0.0.0"

  # Optional: sync configs/schema.ts to the database after schema changes.
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: migrator
    network_mode: host
    env_file: .env
    profiles: ["tools"]
