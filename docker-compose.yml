services:
  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      # Host port 3003 (what Caddy proxies to) -> container port 3000.
      - "3003:3000"
    # Uses your existing .env (DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL, ...).
    env_file: .env
    # Override any PORT/HOSTNAME in .env so the server listens where the port mapping expects.
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

  # Optional: sync configs/schema.ts to the database after schema changes.
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: migrator
    env_file: .env
    profiles: ["tools"]
