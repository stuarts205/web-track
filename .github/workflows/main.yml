name: Build and Deploy webtracking.io

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # becomes ghcr.io/stuarts205/web-track

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "tag=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Raspberry Pi is ARM - adjust to arm/v7 if you're on a 32-bit OS
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pre-trust the Pi's host key so ssh doesn't prompt
          ssh-keyscan -p "${{ secrets.PI_PORT || 22 }}" "${{ secrets.PI_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to Raspberry Pi over SSH
        env:
          PI_HOST: ${{ secrets.PI_HOST }}
          PI_USER: ${{ secrets.PI_USER }}
          PI_PORT: ${{ secrets.PI_PORT || 22 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -e
          # Bracket the host ourselves only if it's a raw IPv6 literal (contains a colon and isn't already bracketed)
          if [[ "$PI_HOST" == *:* && "$PI_HOST" != \[*\] ]]; then
            TARGET="[$PI_HOST]"
          else
            TARGET="$PI_HOST"
          fi

          ssh -i ~/.ssh/deploy_key -p "$PI_PORT" -o StrictHostKeyChecking=accept-new "$PI_USER@$TARGET" bash -s <<EOF
            set -e
            cd ~/sites/web-track
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
          EOF
